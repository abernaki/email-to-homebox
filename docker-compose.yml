services:
  email-to-homebox:
    build: .
    command: ["python", "src/app.py", "--live"]
    restart: unless-stopped
    env_file: .env
    # This service is the explicit live daemon; review .env and config before starting.
    # Set OLLAMA_HOST to an address reachable from this container.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
